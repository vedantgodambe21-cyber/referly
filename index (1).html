<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referly – referrals from people inside</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F9;--surface:#fff;--ink:#17213B;--mute:#5E6880;--line:#DDE1E9;--accent:#0B8574;--accent-ink:#fff;--warm:#B8650A;--warm-bg:#FCEFD9;--ok-bg:#DDF3EE;--err:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#0F1524;--surface:#172036;--ink:#EDF0F7;--mute:#9AA5BF;--line:#2A3552;--accent:#3FC2AE;--accent-ink:#06201B;--warm:#F0B25E;--warm-bg:#3A2B12;--ok-bg:#12372F;--err:#FF8A80}}
html{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.15;margin:8px 0 6px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.05rem;margin:0 0 4px;font-weight:700}p{margin:0}.mute{color:var(--mute)}.small{font-size:.86rem}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;display:flex;align-items:center;gap:8px}.brand i{width:22px;height:22px;border-radius:50% 50% 50% 4px;background:var(--accent)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:16px 0 8px}
.tabs button{border:0;background:none;font:inherit;font-weight:700;color:var(--mute);padding:10px 0;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.86rem;padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:12px;background:var(--ok-bg);color:var(--accent);display:grid;place-items:center;font-weight:800}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ok-bg);color:var(--accent);margin-right:6px}.tag.warm{background:var(--warm-bg);color:var(--warm)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn[disabled]{opacity:.55;cursor:default}
form{display:grid;gap:12px;margin-top:12px}label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}
.narrow{max-width:420px;margin:40px auto}
.steps{display:flex;margin-top:12px}.steps span{flex:1;font-size:.72rem;color:var(--mute);text-align:center;position:relative;padding-top:16px}
.steps span:before{content:"";position:absolute;top:2px;left:0;right:0;height:4px;background:var(--line)}
.steps span.on{color:var(--ink);font-weight:700}.steps span.on:before{background:var(--accent)}
.empty{padding:32px 0;text-align:center}.err{color:var(--err);font-weight:700;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);width:min(440px,92vw);padding:20px}dialog::backdrop{background:rgba(10,15,30,.55)}
@media (max-width:480px){.row{grid-template-columns:44px 1fr}.row .act{grid-column:2}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ====== PASTE YOUR TWO VALUES HERE ====== */
var SUPABASE_URL="https://mxmyiruwkjxkdskswrfg.supabase.co/rest/v1/";
var SUPABASE_KEY="sb_publishable_rYrYLY2amzmu43RK1d3fRg_vS9FSrnt";
/* ======================================== */
var FREE=["gmail.com","yahoo.com","yahoo.in","outlook.com","hotmail.com","live.com","rediffmail.com","icloud.com","proton.me","protonmail.com"];
var STEPS=["Requested","Accepted","Referred","Interview","Hired"];
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var $=function(s){return document.querySelector(s)};
var me=null,profile=null,tab="",filter="all",posts=[],list=[],mine=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},2400)}
function ini(n){return String(n||"?").split(" ").map(function(w){return w[0]}).join("").slice(0,2)}
function shell(inner){return '<div class="top"><div class="brand"><i></i>Referly</div>'+(me?'<button class="btn ghost" id="out">Sign out</button>':'')+'</div>'+inner}
async function boot(){
 if(SUPABASE_URL.indexOf("PASTE")===0){$("#root").innerHTML=shell('<div class="box"><h2>Almost there</h2><p>Open this file and paste your Supabase URL and key at the top of the script.</p></div>');return}
 var s=await sb.auth.getSession();me=s.data.session?s.data.session.user:null;
 if(!me)return loginView();
 var p=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();profile=p.data;
 if(!profile)return onboardView();
 tab=profile.role==="seeker"?"browse":"post";appView();
}
function loginView(step,email){
 $("#root").innerHTML=shell('<div class="narrow"><h1>Get referred by someone who works there.</h1>'+(step==="code"?
 '<h2 style="margin-top:16px">Check your email</h2><p class="mute">We sent a sign-in link to '+esc(email)+'. Open it on this device to continue. It can take a minute, and you may need to check spam.</p>':
 '<p class="mute">Referrers: use your company email. Job seekers: any email works.</p><form id="lf"><label>Email<input name="em" type="email" required></label><p class="err" id="e"></p><button class="btn">Email me a sign-in link</button></form>')+'</div>');
 var lf=$("#lf");if(lf)lf.onsubmit=async function(e){e.preventDefault();var em=new FormData(lf).get("em").trim().toLowerCase();
  var r=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:window.location.origin}});if(r.error)return $("#e").textContent=r.error.message;loginView("code",em)};
 var cf=$("#cf");if(cf)cf.onsubmit=async function(e){e.preventDefault();var t=new FormData(cf).get("c").trim();
  var r=await sb.auth.verifyOtp({email:email,token:t,type:"email"});if(r.error)return $("#e").textContent="That code didn’t work. Check it and try again.";boot()};
}
function onboardView(){
 var dom=me.email.split("@")[1],free=FREE.indexOf(dom)>-1;
 $("#root").innerHTML=shell('<div class="narrow"><h1>Set up your profile</h1><form id="pf"><label>Your name<input name="n" required></label>'
 +'<label>I am a<select name="r"><option value="seeker">Job seeker</option><option value="referrer">Referrer (I work at a company)</option></select></label>'
 +'<label id="cl" style="display:none">Company name<input name="c"></label><p class="err" id="e"></p><button class="btn">Continue</button></form></div>');
 var sel=$("[name=r]");sel.onchange=function(){$("#cl").style.display=sel.value==="referrer"?"grid":"none"};
 $("#pf").onsubmit=async function(e){e.preventDefault();var f=new FormData(e.target),r=f.get("r");
  if(r==="referrer"&&free)return $("#e").textContent="Referrers must sign in with a company email, not "+dom+".";
  var x=await sb.from("profiles").insert({id:me.id,full_name:f.get("n"),role:r,company:f.get("c")||null,work_email_verified:r==="referrer"});
  if(x.error)return $("#e").textContent=x.error.message;boot()};
}
function tabsHtml(t){return '<div class="tabs" role="tablist">'+t.map(function(x){return '<button role="tab" aria-selected="'+(tab===x[0])+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'}
async function appView(){
 var seek=profile.role==="seeker";
 var t=seek?[["browse","Find a referrer"],["track","My requests"]]:[["post","Post a role"],["inbox","Requests"],["mine","My posts"]];
 $("#root").innerHTML=shell('<p class="mute small" style="margin-top:8px">Hi '+esc(profile.full_name)+(profile.company?' · '+esc(profile.company):'')+'</p>'+tabsHtml(t)+'<div id="body"><p class="mute" style="padding:24px 0">Loading…</p></div>');
 $("#out").onclick=async function(){await sb.auth.signOut();me=null;boot()};
 document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;appView()}});
 var b=$("#body");
 if(tab==="browse")return browse(b);if(tab==="track")return track(b);
 if(tab==="post")return postForm(b);if(tab==="inbox")return inbox(b);return myPosts(b);
}
async function browse(b){
 var r=await sb.from("posts").select("*").order("created_at",{ascending:false});posts=r.data||[];
 var q=await sb.from("requests").select("post_id").eq("seeker_id",me.id);var sent=(q.data||[]).map(function(x){return x.post_id});
 var f=[["all","All"],["refer","Can refer"],["replace","Replacement needed"]];
 b.innerHTML='<div class="chips">'+f.map(function(x){return '<button class="chip" data-f="'+x[0]+'" aria-pressed="'+(filter===x[0])+'">'+x[1]+'</button>'}).join("")+'</div><label class="small">Search role, company or city<input id="q" type="search"></label><div id="list"></div>';
 var draw=function(){var s=$("#q").value.toLowerCase();
  var o=posts.filter(function(p){return(filter==="all"||p.kind===filter)&&(p.role_title+p.company+p.city).toLowerCase().indexOf(s)>-1});
  $("#list").innerHTML=o.length?o.map(function(p){var d=sent.indexOf(p.id)>-1;
   return '<div class="row"><div class="av">'+esc(ini(p.referrer_name))+'</div><div><h2>'+esc(p.role_title)+'</h2><p class="small mute">'+esc(p.referrer_name)+' at '+esc(p.company)+' · '+esc(p.city)+(p.experience?' · '+esc(p.experience):'')+'</p><p style="margin-top:6px"><span class="tag">Verified work email</span>'+(p.kind==="replace"?'<span class="tag warm">Replacement needed</span>':'')+'</p><p class="small" style="margin-top:6px">'+esc(p.note)+'</p></div><div class="act"><button class="btn'+(d?' ghost':'')+'" data-req="'+p.id+'" '+(d?'disabled':'')+'>'+(d?'Requested':'Ask for referral')+'</button></div></div>'}).join(""):'<div class="empty"><h2>No posts yet</h2><p class="mute">Check back soon, or try a different filter.</p></div>';
  document.querySelectorAll("[data-req]").forEach(function(x){x.onclick=function(){reqDialog(+x.dataset.req)}})};
 draw();$("#q").oninput=draw;document.querySelectorAll("[data-f]").forEach(function(c){c.onclick=function(){filter=c.dataset.f;browse(b)}});
}
function reqDialog(pid){
 var p=posts.filter(function(x){return x.id===pid})[0],d=$("#dlg");
 d.innerHTML='<h2>Ask '+esc(p.referrer_name)+' for a referral</h2><p class="small mute">'+esc(p.role_title)+' at '+esc(p.company)+'</p><form id="rf"><label>Top skills<input name="s" placeholder="Java, Spring, SQL" required></label><label>Message<textarea name="m" rows="3" required>Hi, I’m interested in this role and my profile matches. Could you refer me?</textarea></label><label>Resume (PDF or Word, max 5 MB)<input type="file" name="f" accept=".pdf,.doc,.docx" required></label><p class="err" id="e"></p><div style="display:flex;gap:8px"><button class="btn">Send request</button><button class="btn ghost" type="button" id="cx">Cancel</button></div></form>';
 d.showModal();$("#cx").onclick=function(){d.close()};
 $("#rf").onsubmit=async function(e){e.preventDefault();var f=new FormData(e.target),file=f.get("f");
  if(file.size>5*1024*1024)return $("#e").textContent="Resume is over 5 MB.";
  var path=me.id+"/"+pid+"-"+Date.now()+"-"+file.name.replace(/[^\w.-]/g,"_");
  var u=await sb.storage.from("resumes").upload(path,file);if(u.error)return $("#e").textContent=u.error.message;
  var r=await sb.from("requests").insert({post_id:pid,seeker_id:me.id,seeker_name:profile.full_name,skills:f.get("s"),message:f.get("m"),resume_path:path});
  if(r.error)return $("#e").textContent=r.error.message;d.close();toast("Request sent");appView()};
}
async function track(b){
 var r=await sb.from("requests").select("*,posts(*)").eq("seeker_id",me.id).order("created_at",{ascending:false});var l=r.data||[];
 b.innerHTML=l.length?l.map(function(x){return '<div class="box"><h2>'+esc(x.posts.role_title)+' at '+esc(x.posts.company)+'</h2><p class="small mute">Referrer: '+esc(x.posts.referrer_name)+'</p><div class="steps">'+STEPS.map(function(s,i){return '<span class="'+(i<=x.status?'on':'')+'">'+s+'</span>'}).join("")+'</div></div>'}).join(""):'<div class="empty"><h2>No requests yet</h2><p class="mute">Find a referrer and send your first request.</p></div>';
}
function postForm(b){
 b.innerHTML='<form id="po"><label>Role you can refer for<input name="r" required></label><label>City<input name="c" required></label><label>Experience wanted<input name="x" placeholder="3–6 yrs"></label><label>I want to<select name="k"><option value="refer">Refer someone</option><option value="replace">Find my replacement (I’m resigning)</option></select></label><label>Short note<textarea name="n" rows="3" placeholder="Skills you’re looking for"></textarea></label><p class="err" id="e"></p><button class="btn">Publish</button></form>';
 $("#po").onsubmit=async function(e){e.preventDefault();var f=new FormData(e.target);
  var r=await sb.from("posts").insert({referrer_id:me.id,referrer_name:profile.full_name,company:profile.company,role_title:f.get("r"),city:f.get("c"),experience:f.get("x"),kind:f.get("k"),note:f.get("n")});
  if(r.error)return $("#e").textContent=r.error.message;toast("Published");tab="mine";appView()};
}
async function myPosts(b){
 var r=await sb.from("posts").select("*").eq("referrer_id",me.id).order("created_at",{ascending:false});var l=r.data||[];
 b.innerHTML=l.length?l.map(function(p){return '<div class="box"><h2>'+esc(p.role_title)+'</h2><p class="small mute">'+esc(p.city)+' · '+(p.kind==="replace"?"Replacement needed":"Can refer")+'</p><button class="btn ghost" data-del="'+p.id+'" style="margin-top:10px">Remove</button></div>'}).join(""):'<div class="empty"><h2>No posts yet</h2><p class="mute">Roles you publish will show here.</p></div>';
 document.querySelectorAll("[data-del]").forEach(function(x){x.onclick=async function(){await sb.from("posts").delete().eq("id",+x.dataset.del);appView()}});
}
async function inbox(b){
 var r=await sb.from("requests").select("*,posts!inner(*)").eq("posts.referrer_id",me.id).order("created_at",{ascending:false});var l=r.data||[];
 b.innerHTML=l.length?l.map(function(x){return '<div class="box"><h2>'+esc(x.seeker_name)+' wants a referral</h2><p class="small mute">For '+esc(x.posts.role_title)+' · '+esc(x.skills)+'</p><p class="small" style="margin:8px 0">“'+esc(x.message)+'”</p><p class="small mute" style="margin-bottom:10px">Status: <b style="color:var(--ink)">'+STEPS[x.status]+'</b></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-cv="'+esc(x.resume_path)+'">View resume</button>'+(x.status<4?'<button class="btn" data-adv="'+x.id+'" data-s="'+x.status+'">Mark as '+STEPS[x.status+1].toLowerCase()+'</button>':'<span class="tag">Hired</span>')+'</div></div>'}).join(""):'<div class="empty"><h2>No requests yet</h2><p class="mute">Requests from job seekers will appear here.</p></div>';
 document.querySelectorAll("[data-cv]").forEach(function(x){x.onclick=async function(){var u=await sb.storage.from("resumes").createSignedUrl(x.dataset.cv,300);if(u.data)window.open(u.data.signedUrl,"_blank");else toast("Could not open resume")}});
 document.querySelectorAll("[data-adv]").forEach(function(x){x.onclick=async function(){await sb.from("requests").update({status:+x.dataset.s+1}).eq("id",+x.dataset.adv);toast("Seeker can now see the update");inbox(b)}});
}
boot();
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_IN"&&!me){boot()}});
</script>
</body>
</html>
